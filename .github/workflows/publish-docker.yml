name: Publish Docker images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/infiniteroomlabs/claudesync

jobs:
  # Release gate: images must never publish from a commit whose tests fail.
  # (publish-npm.yml carries its own build+test gate; this mirrors it.)
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  publish:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: mcp
            dockerhub_image: claudesync-mcp
          - target: cli
            dockerhub_image: claudesync
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.GHCR_IMAGE }}-${{ matrix.target }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.dockerhub_image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
